<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}VulnScan{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <h1>VulnScan</h1>
        <p class="page-description">
          Monitor web sencillo para visualizar procesos y consumo de CPU.
        </p>
      </header>

      <nav class="actions">
        <a href="{{ url_for('app.index') }}">Inicio</a>
        <a href="{{ url_for('app.reporte') }}">Reporte</a>
        <a href="{{ url_for('app.solo_grafica') }}">Gráfica</a>
      </nav>

      <main>{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
